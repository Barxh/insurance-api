logging:
  level:
    org.flywaydb: DEBUG
spring:
  application:
    name: insurance
  datasource:
    url: jdbc:postgresql://localhost:5432/fioneer_insurance_dev
    username: fioneer_admin
    password: fioneer_password
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  docker:
    compose:
      lifecycle-management: start-and-stop

security:
  jwt:
    secret: "${JWT_SECRET:45363888fe5844e136e03bd9349d197b38c1564093786447e4c13b894c78eba3}"
    issuer: insurance-api
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
